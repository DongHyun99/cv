name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # build 와 deploy 를 같은 job 에 두면 upload-pages-artifact 직후 deploy-pages 가
  # 아직 인덱싱되지 않은 artifact 를 조회해 "No artifacts named github-pages" 로
  # 실패하는 레이스 컨디션이 있다 (actions/deploy-pages#451). job 을 분리해 그 사이
  # 자연스러운 지연을 두면 회피된다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # content/*.md 를 index.html 에 미리 그려 넣어 _site/ 에 만든다 (JS 없이도 내용이 보이게)
      - run: node scripts/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
