<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f4f5; --panel: #ffffff; --text: #18181b; --muted: #71717a;
    --line: #e4e4e7; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 12px 16px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--text); color: #fff; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--text);
  }
  .tabs button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin-left: auto; }

  main { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.08); transform: translateY(-2px); }
  .thumb { position: relative; height: 300px; overflow: hidden; border-bottom: 1px solid var(--line); }
  .thumb iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 960px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .meta { padding: 12px 14px; }
  .meta b { font-size: 14px; }
  .meta p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .full { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .full .bar { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .full .bar b { color: var(--text); }
  .full iframe { width: 100%; height: calc(100vh - 150px); border: 0; display: block; }
  .full.mobile iframe { width: 390px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>CV 페이지 테마 고르기</h1>
  <div class="seg" id="mode">
    <button data-mode="grid" class="on">한눈에 비교</button>
    <button data-mode="full">크게 보기</button>
  </div>
  <div class="seg" id="device" hidden>
    <button data-dev="desktop" class="on">데스크톱</button>
    <button data-dev="mobile">모바일</button>
  </div>
  <div class="tabs" id="tabs" hidden></div>
  <span class="hint">카드를 클릭하면 크게 볼 수 있어요 · 내용은 모두 예시입니다</span>
</header>
<main id="main"></main>

<script>
/* ---------- 예시 데이터 (나중에 실제 CV로 교체) ---------- */
const D = {
  name: "Your Name",
  keywords: "Multimodal Learning · Efficient LLMs · Trustworthy AI",
  title: "Ph.D. Student · Graduate School of Artificial Intelligence",
  affil: "Example University",
  bio: "I study how models can learn <em>robust, generalizable representations</em> with less supervision. Recently I have been working on <em>efficient adaptation of large models</em> and evaluating their reliability in the real world.",
  stats: "3 first-author papers (NeurIPS, ICLR, CVPR) · 1 oral · Outstanding Reviewer Award (CVPR 2026)",
  links: [["Email","mail"],["Scholar","cap"],["GitHub","code"],["LinkedIn","in"],["CV","doc"]],
  news: [
    ["2026.09", "Paper", "<b>SparseMM</b> accepted at <b>NeurIPS 2026</b> as a spotlight."],
    ["2026.06", "Position", "Joining <b>Example AI Lab</b> as a research intern."],
    ["2026.03", "Award", "Received the <b>Outstanding Reviewer Award</b> at CVPR 2026."],
    ["2026.01", "Preprint", "<b>TrustBench</b> released on arXiv."],
  ],
  interests: ["Multimodal Learning", "Efficient LLMs", "Representation Learning", "Trustworthy AI"],
  topics: ["Multimodal", "Efficient LLM", "Preprint"],
  pubs: [
    { short: "SparseMM", t: "Learning Robust Multimodal Representations with Sparse Supervision", a: "<u>Your Name</u>, Coauthor A, Advisor B", v: "NeurIPS 2026", y: 2026, tag: "Spotlight", topic: "Multimodal", act: ["paper","code","project"] },
    { short: "AdaLoRA+", t: "Efficient Fine-Tuning of Large Language Models via Adaptive Low-Rank Updates", a: "Coauthor C*, <u>Your Name</u>*, Advisor B", v: "ICLR 2026", y: 2026, tag: "", topic: "Efficient LLM", act: ["paper","code"] },
    { short: "TrustBench", t: "TrustBench: Evaluating Reliability of Vision-Language Models in the Wild", a: "<u>Your Name</u>, Coauthor D, Advisor B", v: "arXiv Preprint", y: 2026, tag: "", topic: "Multimodal Preprint", act: ["arXiv"] },
    { short: "VLReliab", t: "A Benchmark for Evaluating Reliability in Vision-Language Models", a: "<u>Your Name</u>, Coauthor D, Coauthor E, Advisor B", v: "CVPR 2025", y: 2025, tag: "Oral", topic: "Multimodal", act: ["paper","code","slides"] },
  ],
  research: [
    ["SparseMM", "Learning from sparse multimodal supervision", "Align image–text representations using only a small fraction of paired data.", "+4.2% zero-shot accuracy · 10× fewer labels"],
    ["AdaLoRA+", "Adaptive low-rank fine-tuning for LLMs", "Allocate the rank budget per layer during training for cheaper adaptation.", "0.3% trainable params · matches full fine-tuning"],
  ],
  exp: [
    ["2026", "Example AI Lab", "Research Intern · Efficient multimodal foundation models"],
    ["2024", "Example Tech", "ML Engineer Intern · LLM serving and evaluation"],
  ],
  edu: [
    ["Example University", "Ph.D. in Artificial Intelligence · 2023 – present · Advisor: Prof. Advisor B"],
    ["Example University", "B.S. in Computer Science · 2019 – 2023 · Summa cum laude"],
  ],
  awards: [
    ["2026", "Outstanding Reviewer Award, CVPR"],
    ["2025", "Best Paper Award, Example Workshop @ ICML"],
    ["2024", "National Graduate Fellowship"],
  ],
};

const FONTS = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap';
const ICON = {
  mail: '<path d="M3 6h18v12H3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2"/>',
  cap: '<path d="M12 4 1 9.5l11 5.5 11-5.5z"/><path d="M5 12.5V17c2 2 12 2 14 0v-4.5l-7 3.5z"/>',
  code: '<path d="M8 6 2 12l6 6M16 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2"/>',
  in: '<rect x="2" y="2" width="20" height="20" rx="4"/><path d="M7 10v7M7 7v.01M11 17v-7M11 13c0-2 1.2-3 2.8-3S16.5 11 16.5 13v4" stroke="#fff" stroke-width="2" fill="none"/>',
  doc: '<path d="M6 2h9l5 5v15H6z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12h7M9 16h7" stroke="currentColor" stroke-width="2"/>',
};
const icon = k => `<svg viewBox="0 0 24 24" fill="currentColor">${ICON[k]}</svg>`;
const me = s => s.replace(/<u>(.*?)<\/u>/g, "<strong>$1</strong>");

/*
 * 공통 구조(레퍼런스와 같은 정보 구성) + 테마별 개성(c):
 *  accent/soft 색, font, radius, card: "line"(테두리) | "fill"(채운 박스),
 *  photo: 사진 크기·모양, layout: "top"(상단 nav) | "side"(왼쪽 고정 프로필),
 *  bg, title: 섹션 제목 스타일, extra: 추가 CSS
 */
function build(c) {
  const R = c.radius;
  const photo = `<div class="pf">PHOTO</div>`;
  const links = `<div class="links">${D.links.map(([l,k])=>`<a href="#">${icon(k)}${l}</a>`).join("")}</div>`;
  const profile = c.layout === "side"
    ? `<aside>${photo}<h1>${D.name}</h1><div class="kw">${D.keywords}</div><div class="sub">${D.title}<br>${D.affil}</div>${links}</aside>`
    : `<section id="about" class="hero">${photo}<div class="info"><h1>${D.name}</h1><div class="kw">${D.keywords}</div><div class="sub">${D.title}<br>${D.affil}</div>${links}<p class="bio">${D.bio}</p><p class="stats">${D.stats}</p></div></section>`;
  const sections = `
    ${c.layout === "side" ? `<section id="about"><p class="bio" style="margin-top:0">${D.bio}</p><p class="stats">${D.stats}</p></section>` : ""}
    <section id="news"><h2>News</h2><ul class="list">${D.news.map(([d,b,t])=>`<li><span class="dt">${d}</span><span><span class="bd bd-${b.toLowerCase()}">${b}</span>${t}</span></li>`).join("")}</ul></section>
    <section id="publications"><h2>Publications</h2>
      <div class="filters"><button class="on" data-f="all">All</button>${D.topics.map(t=>`<button data-f="${t}">${t}</button>`).join("")}</div>
      <div class="pubs">${D.pubs.map(p=>`<div class="card pub" data-topic="${p.topic}"><div class="th">${p.short}</div><div class="pb">
        <div class="ven">${p.v}<span class="yr">${p.y}</span>${p.tag?`<span class="hl">${p.tag}</span>`:""}</div>
        <h3>${p.t}</h3><div class="au">${me(p.a)}</div><div class="act">${p.act.map(a=>`<a href="#">${a}</a>`).join("")}</div></div></div>`).join("")}</div></section>
    <section id="research"><h2>Selected Research</h2><div class="rg">${D.research.map(([tag,h,p,m])=>`<div class="card rc"><span class="rt">${tag}</span><h3>${h}</h3><p>${p}</p><div class="met">${m}</div></div>`).join("")}</div></section>
    <section id="experience"><h2>Experience</h2><ul class="list">${D.exp.map(([y,o,r])=>`<li><span class="dt">${y}</span><span><b>${o}</b><br><span class="mut">${r}</span></span></li>`).join("")}</ul></section>
    <section id="education"><h2>Education</h2>${D.edu.map(([s,d])=>`<div class="edu"><i></i><div><b>${s}</b><div class="mut">${d}</div></div></div>`).join("")}</section>
    <section id="awards"><h2>Awards</h2><ul class="list">${D.awards.map(([y,t])=>`<li><span class="dt">${y}</span><span>${t}</span></li>`).join("")}</ul></section>`;
  const nav = `<nav><span class="brand">${c.brandDot ? '<i class="bdot"></i>' : ""}${D.name}</span>${["About","News","Publications","Research","Experience","Education","Awards"].map(s=>`<a href="#${s.toLowerCase()}">${s}</a>`).join("")}</nav>`;
  const body = c.layout === "side"
    ? `${nav}<div class="side">${profile}<main>${sections}<footer>© 2026 ${D.name}</footer></main></div>`
    : `${nav}<div class="wrap">${profile}${sections}<footer>© 2026 ${D.name}</footer></div>`;

  const card = c.card === "fill"
    ? `background:var(--soft2);border:1px solid transparent;`
    : `background:var(--bg);border:1px solid var(--line);`;
  const css = `
    :root{--ac:${c.accent};--soft:${c.soft};--soft2:${c.soft2 || "#f6f6f7"};--tx:${c.text || "#1f1f23"};--mut:${c.muted || "#6b6b74"};--line:${c.line || "#e7e7ea"};--bg:${c.bg || "#fff"}}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:${c.font};color:var(--tx);background:var(--bg);font-size:15px;line-height:1.7}
    a{color:var(--ac);text-decoration:none}
    nav{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:24px;height:54px;padding:0 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
    nav .brand{font-weight:700;margin-right:auto;display:flex;align-items:center;gap:8px}
    nav a{color:var(--mut);font-size:14px;font-weight:500}nav a:hover{color:var(--ac)}
    .wrap{max-width:880px;margin:0 auto;padding:0 24px}
    .hero{display:flex;gap:40px;align-items:flex-start;padding:60px 0 8px}
    .pf{width:${c.photo}px;height:${c.photoH || c.photo}px;border-radius:${c.photoR};background:var(--soft);color:var(--ac);opacity:.9;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.1em;flex-shrink:0;${c.photoX || ""}}
    h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
    .kw{color:var(--ac);font-weight:600;font-size:14px;margin-top:6px}
    .sub{color:var(--mut);font-size:14.5px;line-height:1.55;margin-top:6px}
    .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
    .links a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--tx);border:1px solid var(--line);background:var(--bg);border-radius:${c.pill ? "999px" : R};padding:4px 11px;transition:.15s}
    .links a:hover{border-color:var(--ac);color:var(--ac)}.links svg{width:14px;height:14px}
    .bio{margin-top:18px;max-width:600px}.bio em{font-style:normal;color:var(--ac);font-weight:600}
    .stats{margin-top:10px;font-size:13px;color:var(--mut)}
    section{padding-top:56px}
    h2{${c.title}}
    .list{list-style:none}
    .list li{display:flex;gap:18px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
    .list li:last-child{border:0}
    .dt{min-width:64px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px;padding-top:1px}
    .bd{display:inline-block;font-size:11px;font-weight:700;border-radius:${c.pill ? "999px" : "4px"};padding:1px 8px;margin-right:7px;vertical-align:1px;background:var(--soft);color:var(--ac)}
    .bd-award{background:#fdf1dc;color:#a8650a}.bd-position{background:#e2f5ec;color:#1e7a55}.bd-preprint{background:#efeff1;color:#6b6b74}
    .mut{color:var(--mut);font-size:13.5px}
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
    .filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--mut);border-radius:999px;padding:4px 14px;cursor:pointer;transition:.15s}
    .filters button.on,.filters button:hover{background:var(--ac);border-color:var(--ac);color:#fff}
    .pubs{display:flex;flex-direction:column;gap:14px}
    .card{${card}border-radius:${R};transition:.18s}
    .card:hover{${c.card === "fill" ? "background:var(--soft);" : "box-shadow:0 6px 20px rgba(0,0,0,.06);border-color:var(--soft);"}}
    .pub{display:flex;gap:18px;padding:16px}
    .th{width:112px;height:80px;flex-shrink:0;border-radius:calc(${R} * .7);background:linear-gradient(135deg,var(--soft),color-mix(in srgb,var(--ac) 22%,var(--soft)));display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ac)}
    .pb{flex:1;min-width:0}
    .ven{font-size:12px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
    .yr,.hl{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin-left:6px;text-transform:none;letter-spacing:0}
    .yr{background:var(--soft);font-weight:600}.hl{background:#fdecec;color:#c2410c}
    .pub h3{font-size:15px;font-weight:700;line-height:1.4;margin:4px 0 2px}
    .au{font-size:13px;color:var(--mut)}.au strong{color:var(--tx)}
    .act{display:flex;gap:6px;margin-top:8px}
    .act a{font-size:12px;color:var(--tx);border:1px solid var(--line);border-radius:${c.pill ? "999px" : "5px"};padding:1px 10px;transition:.15s;background:var(--bg)}
    .act a:hover{background:var(--ac);border-color:var(--ac);color:#fff}
    .rg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .rc{padding:18px}
    .rt{display:inline-block;font-family:'DM Mono',monospace;font-size:11.5px;font-weight:500;background:var(--soft);color:var(--ac);border-radius:4px;padding:1px 8px}
    .rc h3{font-size:14.5px;margin:8px 0 4px;line-height:1.4}.rc p{font-size:13px;color:var(--mut)}
    .met{margin-top:10px;font-size:12px;font-weight:600;color:#1e7a55}
    .edu{display:flex;gap:16px;padding:8px 0}.edu i{width:10px;height:10px;border-radius:50%;background:var(--ac);margin-top:7px;flex-shrink:0}
    footer{text-align:center;color:var(--mut);font-size:13px;padding:40px 0;margin-top:56px;border-top:1px solid var(--line)}
    .side{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;gap:56px;padding:0 24px}
    aside{position:sticky;top:54px;align-self:start;padding-top:48px}
    aside h1{margin-top:20px;font-size:26px}
    @media(max-width:700px){.hero{flex-direction:column;align-items:center;text-align:center}.links{justify-content:center}.th{display:none}.rg{grid-template-columns:1fr}.side{grid-template-columns:1fr;gap:0}aside{position:static}nav{padding:0 16px;gap:16px}}
    ${c.extra || ""}`;
  const js = `<script>document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));const f=b.dataset.f;document.querySelectorAll('.pub').forEach(p=>p.style.display=f==='all'||p.dataset.topic.includes(f)?'':'none')})<\/script>`;
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="${FONTS}" rel="stylesheet"><style>${css}</style></head><body>${body}${js}</body></html>`;
}

const underline = "font-size:18px;font-weight:700;padding-bottom:8px;margin-bottom:22px;border-bottom:2px solid var(--tx)";

/* ---------- 테마 ---------- */
/* ---------- 구조가 다른 테마용 공통 조각 ---------- */
const NUMS = [["4","Publications"],["3","First-author"],["120+","Citations"],["3","Awards"]];
const linksH = () => `<div class="links">${D.links.map(([l,k])=>`<a href="#">${icon(k)}${l}</a>`).join("")}</div>`;
const badge = b => `<span class="bd bd-${b.toLowerCase()}">${b}</span>`;
const venue = p => `<div class="ven">${p.v}<span class="yr">${p.y}</span>${p.tag?`<span class="hl">${p.tag}</span>`:""}</div>`;
const acts = p => `<div class="act">${p.act.map(a=>`<a href="#">${a}</a>`).join("")}</div>`;
const filters = () => `<div class="filters"><button class="on" data-f="all">All</button>${D.topics.map(t=>`<button data-f="${t}">${t}</button>`).join("")}</div>`;
const FILTER_JS = `document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));const f=b.dataset.f;document.querySelectorAll('[data-topic]').forEach(p=>p.style.display=f==='all'||p.dataset.topic.includes(f)?'':'none')});`;
const common = v => `
  :root{--ac:${v.ac};--soft:${v.soft};--tx:${v.tx||"#1f1f23"};--mut:${v.mut||"#6b6b74"};--line:${v.line||"#e7e7ea"};--bg:${v.bg||"#fff"};--card:${v.card||"#fff"}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:${v.font};color:var(--tx);background:var(--bg);font-size:15px;line-height:1.7}
  a{color:var(--ac);text-decoration:none}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--tx);border:1px solid var(--line);background:var(--card);border-radius:${v.pill?"999px":"8px"};padding:4px 11px;transition:.15s}
  .links a:hover{border-color:var(--ac);color:var(--ac)}.links svg{width:14px;height:14px}
  .bio em{font-style:normal;color:var(--ac);font-weight:600}
  .mut{color:var(--mut);font-size:13.5px}
  .bd{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:7px;vertical-align:1px;background:var(--soft);color:var(--ac)}
  .bd-award{background:#fdf1dc;color:#a8650a}.bd-position{background:#e2f5ec;color:#1e7a55}.bd-preprint{background:#efeff1;color:#6b6b74}
  .ven{font-size:12px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
  .yr,.hl{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin-left:6px;text-transform:none;letter-spacing:0}
  .yr{background:var(--soft);font-weight:600}.hl{background:#fdecec;color:#c2410c}
  .au{font-size:13px;color:var(--mut)}.au strong{color:var(--tx)}
  .act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .act a{font-size:12px;color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:1px 10px;transition:.15s;background:var(--card)}
  .act a:hover{background:var(--ac);border-color:var(--ac);color:#fff}

/* ---------- 뷰어 ---------- */
let mode = "grid", current = THEMES[0].id, device = "desktop";
const $ = s => document.querySelector(s);
const main = $("#main"), tabs = $("#tabs");

tabs.innerHTML = THEMES.map(t => `<button data-id="${t.id}">${t.name}</button>`).join("");

function render() {
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  document.querySelectorAll("#device button").forEach(b => b.classList.toggle("on", b.dataset.dev === device));
  tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.id === current));
  tabs.hidden = $("#device").hidden = mode !== "full";
  $(".hint").hidden = mode !== "grid";

  if (mode === "grid") {
    main.innerHTML = `<div class="grid">${THEMES.map(t => `
      <div class="card" data-id="${t.id}"><div class="thumb"><iframe tabindex="-1" loading="lazy"></iframe></div>
      <div class="meta"><b>${t.name}</b><p>${t.desc}</p></div></div>`).join("")}</div>`;
    main.querySelectorAll(".card").forEach(c => {
      const t = THEMES.find(x => x.id === c.dataset.id);
      const f = c.querySelector("iframe");
      f.srcdoc = t.html();
      const fit = () => f.style.transform = `scale(${c.clientWidth / 1280})`;
      fit(); new ResizeObserver(fit).observe(c);
      c.onclick = () => { current = t.id; mode = "full"; render(); };
    });
  } else {
    const t = THEMES.find(x => x.id === current);
    main.innerHTML = `<div class="full ${device}"><div class="bar"><b>${t.name}</b> — ${t.desc}</div><iframe></iframe></div>`;
    main.querySelector("iframe").srcdoc = t.html();
  }
}

$("#mode").onclick = e => { if (e.target.dataset.mode) { mode = e.target.dataset.mode; render(); } };
$("#device").onclick = e => { if (e.target.dataset.dev) { device = e.target.dataset.dev; render(); } };
tabs.onclick = e => { if (e.target.dataset.id) { current = e.target.dataset.id; render(); } };
render();
</script>
